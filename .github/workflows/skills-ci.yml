name: skills-ci

on:
  push:
    branches: [main]
    paths:
      - "skills/geo-evidence-audit/**"
      - "tests/geo-evidence-audit/**"
      - "skills/ai-tool-directory-publisher/**"
      - "tests/ai-tool-directory-publisher/**"
      - "skills/skill-eval-harness/**"
      - "tests/skill-eval-harness/**"
      - "skills/skill-supply-chain-audit/**"
      - "tests/skill-supply-chain-audit/**"
      - "tools/**"
      - ".github/workflows/**"
      - "pytest.ini"
      - "tests/conftest.py"
      - "tests/__init__.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SKILLS: "geo-evidence-audit ai-tool-directory-publisher skill-eval-harness"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --- repo-wide syntax gate over all released skills ---
      - name: py39 syntax gate
        run: python tools/py39_gate.py skills/geo-evidence-audit/scripts skills/ai-tool-directory-publisher/scripts skills/skill-eval-harness/scripts

      # --- SKILL.md line gates (<500) ---
      - name: SKILL.md line gates
        shell: bash
        run: |
          for skill in $SKILLS; do
            lines=$(wc -l < "skills/$skill/SKILL.md")
            echo "skills/$skill/SKILL.md lines: $lines"
            if [ "$lines" -ge 500 ]; then
              echo "::error::skills/$skill/SKILL.md exceeds the 500-line limit"
              exit 1
            fi
          done

      # --- stdlib zero-dep gates (import scan per skill) ---
      - name: stdlib zero-dep gate (geo-evidence-audit)
        shell: bash
        run: |
          if grep -rhE "^(import|from) " skills/geo-evidence-audit/scripts/ \
            | grep -vE "^(import (argparse|ast|csv|fnmatch|json|os|re|sys)|from (dataclasses|extract|geo_data|html|json|os|pathlib|report|rules|sys|typing|unicodedata|urllib)([ .]|$))"; then
            echo "::error::non-stdlib import found in geo-evidence-audit/scripts/"
            exit 1
          fi

      - name: stdlib zero-dep gate (ai-tool-directory-publisher)
        shell: bash
        run: |
          if grep -rhE "^(import|from) " skills/ai-tool-directory-publisher/scripts/ \
            | grep -vE "^(import (argparse|ast|csv|fnmatch|json|os|re|sys)|from (audit|checkers|dataclasses|datetime|directory_data|fnmatch|json|listing|os|re|report|sys|typing|unicodedata|urllib)([ .]|$))"; then
            echo "::error::non-stdlib import found in ai-tool-directory-publisher/scripts/"
            exit 1
          fi

      - name: stdlib zero-dep gate (skill-eval-harness)
        shell: bash
        run: |
          if grep -rhE "^(import|from) " skills/skill-eval-harness/scripts/ \
            | grep -vE "^(import (argparse|ast|fnmatch|json|os|re|sys)|from (audit|checkers|dataclasses|eval_rules|report|skparse)([ .]|$))"; then
            echo "::error::non-stdlib import found in skill-eval-harness/scripts/"
            exit 1
          fi

      - name: Install pytest
        run: python -m pip install pytest

      # --- full test suites ---
      - name: Run test suite (geo-evidence-audit)
        run: python -m pytest tests/geo-evidence-audit/ -q

      - name: Run test suite (ai-tool-directory-publisher)
        run: python -m pytest tests/ai-tool-directory-publisher/ -q

      - name: Run test suite (skill-eval-harness)
        run: python -m pytest tests/skill-eval-harness/ -q

      - name: Run test suite (skill-supply-chain-audit)
        run: python -m pytest tests/skill-supply-chain-audit/ -q

      # --- bootstrap: the harness evaluates every released skill (novera profile) ---
      - name: Bootstrap - eval-harness evaluates all own skills
        shell: bash
        run: |
          set -e
          for skill in $SKILLS; do
            echo "evaluating skills/$skill ..."
            python skills/skill-eval-harness/scripts/audit.py "skills/$skill" > /dev/null
          done
          echo "bootstrap OK (all own skills pass novera profile)"

      # --- fixture smoke, expected-failure cases wrapped in if ---
      - name: Fixture smoke (all skills)
        shell: bash
        run: |
          set -e
          # geo-evidence-audit: expected exit 1 (bare invocation aborts under set -e;
          # `|| true` is forbidden because it would swallow exit 2 as well).
          if python skills/geo-evidence-audit/scripts/audit.py skills/geo-evidence-audit/fixtures/phone-mismatch.md > /dev/null; then
            echo "::error::geo-evidence-audit: expected exit 1, got 0"
            exit 1
          fi
          python skills/geo-evidence-audit/scripts/audit.py skills/geo-evidence-audit/fixtures/consistent-office-cn.md > /dev/null
          # ai-tool-directory-publisher: expected exit 1 on validate, exit 0 on clean listing.
          if python skills/ai-tool-directory-publisher/scripts/audit.py validate skills/ai-tool-directory-publisher/fixtures/bad-pricing.json > /dev/null; then
            echo "::error::ai-tool-directory-publisher: expected exit 1, got 0"
            exit 1
          fi
          python skills/ai-tool-directory-publisher/scripts/audit.py validate skills/ai-tool-directory-publisher/fixtures/valid-listing.json > /dev/null
          # skill-eval-harness: expected exit 1 on a bad fixture, exit 2 without SKILL.md.
          if python skills/skill-eval-harness/scripts/audit.py skills/skill-eval-harness/fixtures/bad-frontmatter > /dev/null; then
            echo "::error::skill-eval-harness: expected exit 1, got 0"
            exit 1
          fi
          if python skills/skill-eval-harness/scripts/audit.py skills/skill-eval-harness/fixtures/not-a-skill > /dev/null 2>&1; then
            echo "::error::skill-eval-harness: expected exit 2 (no SKILL.md), got 0"
            exit 1
          fi
          echo "smoke OK (all skills)"
